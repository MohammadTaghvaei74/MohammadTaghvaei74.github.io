<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Taghvaei | Crypto Product Leader & Trading Systems Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06080d;
            --bg-card: rgba(14, 19, 31, 0.7);
            --bg-card-hover: rgba(20, 28, 46, 0.9);
            --border: #161e31;
            --border-hover: #2b3b5e;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.2);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            /* Brand Colors */
            --brand-telegram: #229ED9;
            --brand-whatsapp: #25D366;
            --brand-linkedin: #0A66C2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 20%, rgba(59, 130, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 50% 80%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Scroll Animations */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero Layout with Avatar */
        header {
            padding: 70px 0 40px;
            text-align: left;
        }

        .hero-layout {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        @media (max-width: 850px) {
            .hero-layout {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 28px;
            }
        }

        .hero-text-content {
            flex: 1;
        }

        /* Avatar Styling */
        .hero-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-glow-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, rgba(59, 130, 246, 0.5) 100%);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: var(--bg-card);
            border: 3px solid var(--bg-base);
        }

        .avatar-status-badge {
            position: absolute;
            bottom: 6px;
            right: 12px;
            width: 22px;
            height: 22px;
            background-color: var(--primary);
            border: 3px solid var(--bg-base);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary);
        }

        .badge-hook {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--primary-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 9999px;
            color: var(--primary);
            font-size: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-size: clamp(34px, 4.5vw, 52px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: clamp(17px, 2.2vw, 21px);
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .hero-subtitle span {
            color: #ffffff;
            font-weight: 600;
        }

        .hero-hook-text {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
            border-left: 3px solid var(--primary);
            padding-left: 18px;
        }

        .hero-hook-text b {
            color: #ffffff;
        }

        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .btn-brand-telegram {
            background-color: var(--brand-telegram);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.3);
        }

        .btn-brand-telegram:hover {
            background-color: #1d8ec4;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.45);
        }

        .btn-brand-whatsapp {
            background-color: var(--brand-whatsapp);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-brand-whatsapp:hover {
            background-color: #20b858;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
        }

        .btn-brand-linkedin {
            background-color: var(--brand-linkedin);
            box-shadow: 0 6px 20px rgba(10, 102, 194, 0.3);
        }

        .btn-brand-linkedin:hover {
            background-color: #084f99;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(10, 102, 194, 0.45);
        }

        /* Dual Track Metrics */
        .metrics-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 40px 0 70px;
        }

        @media (max-width: 768px) {
            .metrics-comparison {
                grid-template-columns: 1fr;
            }
        }

        .metric-column {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-column:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }

        .col-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .col-header h4 {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .badge-personal {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-company {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .stat-row {
            margin-bottom: 20px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .stat-val span {
            color: var(--primary);
        }

        .stat-val.blue span {
            color: var(--accent);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Section Headings */
        .section-header {
            margin-bottom: 32px;
        }

        .section-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 8px;
            max-width: 780px;
        }

        /* Flagship Product Showcase (Special Leverage) */
        .flagship-box {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.8) 0%, rgba(12, 16, 26, 0.9) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 18px;
            padding: 40px;
            margin-bottom: 70px;
