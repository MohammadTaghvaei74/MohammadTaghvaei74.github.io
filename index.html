        :root {
            --bg-base: #06080d;
            --bg-card: rgba(14, 19, 31, 0.75);
            --bg-card-hover: rgba(20, 28, 46, 0.95);
            --border: #161e31;
            --border-hover: #2b3b5e;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.2);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            /* Brand Colors */
            --brand-telegram: #229ED9;
            --brand-whatsapp: #25D366;
            --brand-linkedin: #0A66C2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 20%, rgba(59, 130, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 50% 80%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero Layout with Stage Photo */
        header {
            padding: 75px 0 40px;
            text-align: left;
        }

        .hero-layout {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        @media (max-width: 850px) {
            .hero-layout {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 28px;
            }
        }

        .hero-text-content {
            flex: 1;
        }

        /* Avatar Stage Photo */
        .hero-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-glow-ring {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, rgba(59, 130, 246, 0.7) 100%);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
            background-color: #101522;
            border: 3px solid var(--bg-base);
        }

        .badge-hook {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--primary-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 9999px;
            color: var(--primary);
            font-size: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-size: clamp(34px, 4.5vw, 52px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: clamp(17px, 2.2vw, 21px);
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .hero-subtitle span {
            color: #ffffff;
            font-weight: 600;
        }

        .hero-hook-text {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
            border-left: 3px solid var(--primary);
            padding-left: 18px;
        }

        .hero-hook-text b {
            color: #ffffff;
        }

        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .btn-brand-telegram {
            background-color: var(--brand-telegram);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.3);
        }

            background-color: #1d8ec4;

            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.45);

            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }
