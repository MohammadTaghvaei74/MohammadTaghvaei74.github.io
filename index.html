<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammad Taghvaei | Crypto Product Leader & Trading Systems Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-card: #111622;
            --bg-card-hover: #161c2d;
            --border: #1e2638;
            --border-hover: #2e3a54;
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.15);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            /* Brand Colors */
            --brand-telegram: #229ED9;
            --brand-whatsapp: #25D366;
            --brand-linkedin: #0A66C2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero Layout with Stage Photo */
        header {
            padding: 75px 0 40px;
            text-align: left;
        }

        .hero-layout {
            display: flex;
            align-items: center;
            gap: 48px;
        }

        @media (max-width: 850px) {
            .hero-layout {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 28px;
            }
        }

        .hero-text-content {
            flex: 1;
        }

        /* Avatar Stage Photo */
        .hero-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-glow-ring {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--primary) 0%, rgba(59, 130, 246, 0.7) 100%);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
            background-color: #101522;
            border: 3px solid var(--bg-base);
        }

        .badge-hook {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--primary-glow);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 9999px;
            color: var(--primary);
            font-size: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        h1 {
            font-size: clamp(34px, 4.5vw, 52px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .hero-subtitle {
            font-size: clamp(17px, 2.2vw, 21px);
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .hero-subtitle span {
            color: #ffffff;
            font-weight: 600;
        }

        .hero-hook-text {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
            border-left: 3px solid var(--primary);
            padding-left: 18px;
        }

        .hero-hook-text b {
            color: #ffffff;
        }

        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .btn-brand-telegram {
            background-color: var(--brand-telegram);
            box-shadow: 0 6px 20px rgba(34, 158, 217, 0.3);
        }

        .btn-brand-telegram:hover {
            background-color: #1d8ec4;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.45);
        }

        .btn-brand-whatsapp {
            background-color: var(--brand-whatsapp);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-brand-whatsapp:hover {
            background-color: #20b858;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.45);
        }

        .btn-brand-linkedin {
            background-color: var(--brand-linkedin);
            box-shadow: 0 6px 20px rgba(10, 102, 194, 0.3);
        }

        .btn-brand-linkedin:hover {
            background-color: #084f99;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(10, 102, 194, 0.45);
        }

        /* Options Mastery Card */
        .edge-card-highlight {
            background: #131a29;
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-left: 4px solid var(--accent);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 70px;
        }

        .edge-card-highlight h3 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .edge-card-highlight p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.75;
        }

        /* Section Headings */
        .section-header {
            margin-bottom: 32px;
        }

        .section-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 8px;
            max-width: 780px;
        }

        /* Dual Track Metrics: Personal Product Launches vs Exchange Scale */
        .metrics-comparison {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            margin: 40px 0 70px;
        }

        @media (max-width: 880px) {
            .metrics-comparison {
                grid-template-columns: 1fr;
            }
        }

        .metric-column {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            transition: all 0.3s ease;
        }

        .metric-column:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }

        .col-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .col-header h4 {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
        }

        .badge-personal {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-company {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Pure Product Showcase Inside Personal Column */
        .showcase-group {
            margin-bottom: 22px;
        }

        .showcase-group:last-child {
            margin-bottom: 0;
        }

        .showcase-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .showcase-label.blue {
            color: var(--accent);
        }

        .product-item-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .product-item-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }

        .pic-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .pic-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .pic-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-sunset {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-owner {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .pic-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        /* Right Column (Exchange Stats) */
        .stat-row {
            margin-bottom: 28px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .stat-val.blue span {
            color: var(--accent);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.5;
        }

        /* Flagship Product Showcase (Special Leverage) */
        .flagship-box {
            background: #111622;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 18px;
            padding: 40px;
            margin-bottom: 70px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }

        .flagship-box:hover {
            border-color: rgba(16, 185, 129, 0.5);
        }

        .flagship-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-glow);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }

        .flagship-box h3 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .flagship-box p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .flagship-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .feature-item {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            transition: all 0.2s ease;
        }

        .feature-item:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .feature-item h5 {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .feature-item p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 0;
        }

        .product-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 20px
